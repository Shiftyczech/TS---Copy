name: Build and Release Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Číslo verze (např. 1.0.1)'
        required: false
        default: '1.0.1'

permissions:
  contents: write

jobs:
  build:
    name: Build EvidenceSkleniku.exe
    runs-on: windows-latest

    steps:
      - name: Klonování repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Pythonu 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalace závislostí
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Nastavení čísla verze do app/version.py
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          python -c "
          import os
          ref = os.environ.get('GITHUB_REF_NAME', '')
          inp = os.environ.get('INPUT_VERSION', '')
          tag = inp or ref
          ver = tag.lstrip('vV').strip() if tag else '1.0.0'
          print(f'Kompiluji verzi: {ver}')
          with open('app/version.py', 'w', encoding='utf-8') as f:
              f.write(f'\"\"\"\nApplication version information.\n\"\"\"\nAPP_VERSION = \"{ver}\"\nGITHUB_REPO = \"Shiftyczech/TS---Copy\"\n')
          "

      - name: Sestavení .exe pomocí PyInstaller
        shell: cmd
        run: |
          cd app
          pyinstaller --clean -y EvidenceSkleniku.spec

      - name: Ověření vytvoření .exe
        shell: cmd
        run: |
          if not exist "app\dist\EvidenceSkleniku.exe" (
            echo CHYBA: Soubor app\dist\EvidenceSkleniku.exe nebyl vytvořen!
            exit /b 1
          )
          echo Soubor EvidenceSkleniku.exe byl uspesne vytvoren.

      - name: Publikace GitHub Release a nahrání EvidenceSkleniku.exe
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          tag_name: ${{ github.ref_name }}
          name: Verze ${{ github.ref_name }}
          files: app/dist/EvidenceSkleniku.exe
          generate_release_notes: true
          draft: false
          prerelease: false
