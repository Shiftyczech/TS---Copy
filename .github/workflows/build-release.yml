name: Build and Release Windows Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Číslo verze (např. 1.0.1)'
        required: false
        default: '1.0.1'

permissions:
  contents: write

jobs:
  build:
    name: Build EvidenceSkleniku.exe
    runs-on: windows-latest

    steps:
      - name: Klonování repozitáře
        uses: actions/checkout@v4

      - name: Nastavení Pythonu 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Instalace závislostí
        shell: bash
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Určení verze a tagu
        id: get_version
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
        run: |
          ref="${GITHUB_REF_NAME}"
          inp="${INPUT_VERSION}"
          raw="${inp:-$ref}"
          # Ostraneni 'v' pro cislo verze
          ver="${raw#v}"
          ver="${ver#V}"
          if [ -z "$ver" ]; then
            ver="1.0.1"
          fi
          tag="v${ver}"
          echo "VERSION=${ver}" >> $GITHUB_OUTPUT
          echo "TAG=${tag}" >> $GITHUB_OUTPUT
          echo "Kompiluji verzi: ${ver} s tagem: ${tag}"

      - name: Nastavení čísla verze do app/version.py
        shell: bash
        run: |
          python -c "
          with open('app/version.py', 'w', encoding='utf-8') as f:
              f.write('\"\"\"\nApplication version information.\n\"\"\"\nAPP_VERSION = \"${{ steps.get_version.outputs.VERSION }}\"\nGITHUB_REPO = \"Shiftyczech/TS---Copy\"\n')
          "

      - name: Sestavení .exe pomocí PyInstaller
        shell: cmd
        run: |
          cd app
          pyinstaller --clean -y EvidenceSkleniku.spec

      - name: Ověření vytvoření .exe
        shell: cmd
        run: |
          if not exist "app\dist\EvidenceSkleniku.exe" (
            echo CHYBA: Soubor app\dist\EvidenceSkleniku.exe nebyl vytvořen!
            exit /b 1
          )
          echo Soubor EvidenceSkleniku.exe byl uspesne vytvoren.

      - name: Uložení .exe do artefaktů běhu
        uses: actions/upload-artifact@v4
        with:
          name: EvidenceSkleniku-${{ steps.get_version.outputs.TAG }}
          path: app/dist/EvidenceSkleniku.exe

      - name: Publikace GitHub Release a nahrání EvidenceSkleniku.exe
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.TAG }}
          name: Verze ${{ steps.get_version.outputs.TAG }}
          files: app/dist/EvidenceSkleniku.exe
          generate_release_notes: true
          draft: false
          prerelease: false
